<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">GUITAR — Structured Failure Diagnosis of GUI Agents via State Transitions</title>
  <desc id="desc">Research code for NeurIPS 2026 Evaluations and Datasets Track. A schematic graph highlights functional states and transitions.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#172e48"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#6ee7cf"/><stop offset="1" stop-color="#8faaff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#536981" opacity=".3"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7792b4" stroke-width="1.5"/></marker>
    <marker id="mint" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6ee7cf" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <rect x="52" y="49" width="353" height="30" rx="15" fill="#233e53"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="69" fill="#9ae9dc" font-size="12" font-weight="700" letter-spacing="1.3">NEURIPS 2026 · EVALUATIONS &amp; DATASETS</text>
    <text x="49" y="185" fill="#f5f8ff" font-size="96" font-weight="750" letter-spacing="-4">GUITAR</text>
    <rect x="54" y="207" width="90" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="52" y="261" fill="#e8effa" font-size="27" font-weight="600">Structured Failure Diagnosis</text>
    <text x="52" y="301" fill="#e8effa" font-size="27" font-weight="600">of GUI Agents via State Transitions</text>
    <text x="52" y="351" fill="#a8bbd1" font-size="18">From interaction trajectories to functional state graphs.</text>
    <text x="52" y="420" fill="#82a0bd" font-size="12" letter-spacing="2.4">GUI AGENTS  /  STATE TRANSITIONS  /  FAILURE DIAGNOSIS</text>
    <path d="M660 77V405" stroke="#45607e" opacity=".45"/>
    <text x="718" y="84" fill="#8ca5bf" font-size="12" letter-spacing="2">FUNCTIONAL STATE GRAPH</text>
    <g fill="none" stroke="#7792b4" stroke-width="2" marker-end="url(#arrow)">
      <path d="M799 235L901 172"/><path d="M799 252L901 316"/>
      <path d="M967 172L1082 235"/><path d="M967 316L1082 252"/>
    </g>
    <path d="M934 188V290" fill="none" stroke="#6ee7cf" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#mint)"/>
    <g stroke-width="2">
      <circle cx="770" cy="244" r="32" fill="#20374e" stroke="#91aad0"/>
      <circle cx="934" cy="151" r="36" fill="#20374e" stroke="#91aad0"/>
      <circle cx="934" cy="336" r="36" fill="#163f45" stroke="#6ee7cf"/>
      <circle cx="1115" cy="244" r="32" fill="#20374e" stroke="#91aad0"/>
    </g>
    <g fill="#f2f6ff" font-size="18" text-anchor="middle" font-weight="600">
      <text x="770" y="251">S₁</text><text x="934" y="158">S₂</text><text x="934" y="343">S₃</text><text x="1115" y="251">S₄</text>
    </g>
    <rect x="964" y="228" width="100" height="30" rx="15" fill="#173f45"/>
    <text x="1014" y="248" fill="#9af2df" text-anchor="middle" font-size="12">Transition</text>
    <text x="718" y="421" fill="#8ca5bf" font-size="12">Schematic illustration · states encode functional roles</text>
  </g>
